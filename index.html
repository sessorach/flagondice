<!DOCTYPE html>
<html lang="en">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23191410' stroke='%23c9752f' stroke-width='2'/%3E%3Ccircle cx='11' cy='11' r='2.4' fill='%23e8d9c4'/%3E%3Ccircle cx='21' cy='11' r='2.4' fill='%23e8d9c4'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23e8d9c4'/%3E%3Ccircle cx='11' cy='21' r='2.4' fill='%23e8d9c4'/%3E%3Ccircle cx='21' cy='21' r='2.4' fill='%23e8d9c4'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #191410;
      color: #e8d9c4;
      min-height: 100vh;
    }

    button { font-family: inherit; cursor: pointer; }

    button:disabled { cursor: not-allowed; opacity: 0.5; }

    input[type=text], input[type=number], textarea, select {
      background: #1c150f; border: 0.5px solid #3a2f24; border-radius: 6px;
      padding: 6px 10px; color: #e8d9c4; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.15s; width: 100%;

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a2f24; border-radius: 4px; }

    .site-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    @media (min-width: 900px) {
      .site-header { display: grid; grid-template-columns: 1fr auto 1fr; }
      .site-header-left  { order: 1; justify-self: start; }
      .site-header-brand { order: 2; justify-self: center; }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .field-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .item-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 700px) { .item-grid { grid-template-columns: repeat(2, 1fr); } }

    /* Pairs a compact block (Concept / the sheet's identity header) with
       the equally-compact Skills block, so Skills isn't a sparse
       full-width row on its own. */
    .pair-grid { display: block; }
    @media (min-width: 700px) {
      .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    }

      .sheet-box { border: 1px solid #000 !important; }
    }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const ACCENT = "#c9752f";
const BOOKLINK = "#7fb1c9";
const TEXT = { name: "#e8d9c4", body: "#cdb99e", label: "#c9752f", muted: "#a3907a", faint: "#6e5f4d" };
const PANEL = "#221a13";
const BORDER = "#3a2f24";
const HEADFONT = "'Cinzel', Georgia, serif";
const MAX_SKILL_PIPS = 5;

// Ability entries that exist purely to carry a numeric stat delta (see
// classes.json statMods/hpDelta) — the sheet auto-applies these to the
// stat row, so listing them again under Features would just be noise.
// The Builder still shows everything, stat entries included.
const STAT_ONLY_NAMES = new Set(["Health", "Armor", "Speed", "Mana", "Range", "Armor & Health", "Stats", "Armor, Health & Mana"]);
const STAT_ONLY_LINE = /^Your (Health|Armor|Speed|Mana) (increases|is (increased|reduced))\b/i;

function computeStats(cls, spec, level, heroBlessing, bonusStats) {
  if (!cls) return { health: 0, armor: 0, speed: 0, mana: null };
  let health = cls.stats.health, armor = cls.stats.armor, speed = cls.stats.speed, mana = cls.stats.mana;

  cls.levels.forEach(l => { if (level >= l.level && l.hpDelta) health += l.hpDelta; });

  if (spec && level >= 2) {
    if (spec.manaToHealthAtLevel2) { health += (mana || 0); mana = 0; }
    (spec.statMods || []).forEach(m => {
      if (level < m.level) return;
      if (m.health) health += m.health;
      if (m.armor) armor += m.armor;
      if (m.speed) speed += m.speed;
      if (m.mana != null && mana != null) mana += m.mana;
    });
  }

  if (level >= 10) {
    if (heroBlessing === "health") health += 3;
    if (heroBlessing === "mana" && mana != null) mana += 3;
    if (heroBlessing === "speed") speed += 1;
  }

  // Permanent bumps from statBonus grants (Background features, learned
  // items like Tome of Mana Bolt — see gatherAllGrants/collectStatBonuses
  // below). A non-caster class has no Mana track at all (mana stays
  // null) until something actually grants Mana — at which point it opens
  // one starting from a base of 0, so e.g. a Warrior who learns the Tome
  // of Mana Bolt ends up with 1 max Mana instead of staying null.
  if (bonusStats) {
    if (bonusStats.mana) mana = (mana != null ? mana : 0) + bonusStats.mana;
    if (bonusStats.health) health += bonusStats.health;
    if (bonusStats.armor) armor += bonusStats.armor;
    if (bonusStats.speed) speed += bonusStats.speed;
  }

  armor = Math.max(2, Math.min(6, armor));
  speed = Math.max(1, speed);
  return { health, armor, speed, mana };
}

// ── Bonus trainings/spells — a shared pool (data/bonus-trainings.json)
// that isn't tied to any one class. Each source (a Background, an item
// once learned) contributes independent "grants":
//   { type: "training",  trainingId, manaCost }  — you know it, castable
//                                                   for that much Mana
//   { type: "freeCasts", trainingId, amount }     — N free casts/encounter
//                                                   of a training you have
//   { type: "statBonus", stat, amount }            — flat permanent bump
//                                                   to a core stat
// Keeping these separate means a source can grant just a bonus use of a
// spell someone else taught, or just a stat bonus with no spell at all —
// e.g. Erehai grants the "training" AND a "freeCasts" of Mana Bolt as two
// entries, and the Tome of Mana Bolt grants the "training" AND a
// "statBonus" of +1 Mana as two entries, rather than one bundled object.
function gatherAllGrants(char, backgrounds, items) {
  const list = [];
  const bg = backgrounds.find(b => b.id === char.backgroundId);
  if (bg && bg.grants) bg.grants.forEach(g => list.push({ ...g, source: bg.name }));
  (char.learnedItems || []).forEach(entry => {
    const item = items.find(it => it.name === entry.itemName);
    if (item && item.grants) item.grants.forEach(g => list.push({ ...g, source: item.name }));
  });
  return list;
}

// Aggregates training + freeCasts grants per trainingId: free casts add
// up across sources, and the cheapest Mana cost among them applies.
function collectBonusGrants(char, backgrounds, items) {
  const byTraining = {};
  gatherAllGrants(char, backgrounds, items).forEach(g => {
    if (g.type !== "training" && g.type !== "freeCasts") return;
    const cur = byTraining[g.trainingId] || { trainingId: g.trainingId, freeCasts: 0, manaCost: null, sources: [] };
    if (g.type === "freeCasts") cur.freeCasts += g.amount || 0;
    if (g.type === "training" && g.manaCost != null) cur.manaCost = cur.manaCost == null ? g.manaCost : Math.min(cur.manaCost, g.manaCost);
    cur.sources.push(g.source);
    byTraining[g.trainingId] = cur;
  });
  return Object.values(byTraining);
}

// Sums statBonus grants per stat (e.g. { mana: 1 }) — feeds computeStats.
function collectStatBonuses(char, backgrounds, items) {
  const totals = {};
  gatherAllGrants(char, backgrounds, items).forEach(g => {
    if (g.type === "statBonus") totals[g.stat] = (totals[g.stat] || 0) + (g.amount || 0);
  });
  return totals;
}

function trainingSlots(cls, level, hasSpec) {
  const base = /Spells/.test(cls.trainingsLabel) ? 2 : 1;
  let n = base;
  if (level >= 2 && hasSpec) n += 1;
  if (level >= 3) n += 1;
  if (level >= 6) n += 1;
  if (level >= 9) n += 1;
  return n;
}

// A character starts with 1 free-spend skill point from character
// creation, plus 1 more at each class "Adventurer's Knowledge" milestone
// (levels 4 and 7); the level-10 Hero's Blessing can grant one further
// point if chosen. This is the cap the pip selectors enforce below.
// A Background's bonus point is NOT part of this pool — it's locked to
// whichever skill(s) the Background's own skillChoices restrict it to,
// tracked separately in char.backgroundSkillChoices (see bgBonusMap).
function skillPointBudget(char) {
  let budget = 1;
  if (char.level >= 4) budget += 1;
  if (char.level >= 7) budget += 1;
  if (char.level >= 10 && char.heroBlessing === "skill") budget += 1;
  return budget;
}

const HERO_BLESSINGS = [
  { id: "damage", label: "Attacks deal +1 die of damage" },
  { id: "skill", label: "Gain a point in a Skill of your choice" },
  { id: "health", label: "Health increases by 3" },
  { id: "mana", label: "Mana increases by 3", manaOnly: true },
  { id: "speed", label: "Speed increases by 1" },
];

function makeUid() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function encChar(payload) { return btoa(JSON.stringify(payload)); }
function decChar(str) { try { return JSON.parse(atob(str)); } catch { return null; } }

// ══════════════════════════════════════════════════════════════════
// CHARACTER SLOTS — localStorage holds any number of characters, each
// under its own `flagondice-char-<id>` key, plus a small registry
// (`flagondice-characters`, an [{id, name}] list) so the switcher can
// list them without loading every one, and `flagondice-active-character`
// for which one is currently open.
// ══════════════════════════════════════════════════════════════════

function emptyCharacter() {
  return {
    charName: "", charConcept: "",
    backgroundId: "", backgroundSkillChoices: [],
    skills: { Athletics: 0, Sneak: 0, Notice: 0, Convince: 0, Expertise: 0 },
    classId: "", specId: "", level: 1,
    knownTrainings: [], heroBlessing: "",
    hpCurrent: 0, manaCurrent: 0,
    gold: 0, inventory: [], customItems: [],
    charNotes: "", noteRows: [],
    // Items permanently "Learned" from (e.g. Tome of Mana Bolt) —
    // [{ id, itemName }]. What each one actually grants (training,
    // freeCasts, statBonus) is read live from that item's own `grants`
    // in items.json via gatherAllGrants, not duplicated here — so
    // unlearning (removing an entry) always reverses exactly what that
    // item currently grants. bonusTrainingUses tracks free casts spent
    // this encounter, keyed by trainingId.
    learnedItems: [], bonusTrainingUses: {},
  };
}

function loadCharacterData(id) {
  try {
    const raw = JSON.parse(localStorage.getItem(`flagondice-char-${id}`) || "null");
    return { ...emptyCharacter(), ...raw };
  } catch { return emptyCharacter(); }
}

function saveCharacterData(id, data) {
  localStorage.setItem(`flagondice-char-${id}`, JSON.stringify(data));
}

// One-time upgrade: the first version of this app kept a single character
// directly under `flagondice-character`. If that's present and no slot
// registry exists yet, fold it into a proper slot so nobody's build
// disappears when this ships. The old key is left in place, unused but
// harmless, rather than deleted — a migration bug then just fails to
// migrate instead of destroying data.
function migrateLegacyCharacter() {
  const raw = localStorage.getItem("flagondice-character");
  if (raw === null) return null;
  let data;
  try { data = { ...emptyCharacter(), ...JSON.parse(raw) }; } catch { return null; }
  const id = makeUid();
  saveCharacterData(id, data);
  return { id, name: data.charName || "Unnamed adventurer" };
}

function loadActiveCharacterState() {
  let characters = [];
  try { characters = JSON.parse(localStorage.getItem("flagondice-characters")) || []; } catch {}
  let activeId = localStorage.getItem("flagondice-active-character");

  if (characters.length === 0) {
    const migrated = migrateLegacyCharacter();
    if (migrated) {
      characters = [migrated];
      activeId = migrated.id;
    } else {
      const id = makeUid();
      saveCharacterData(id, emptyCharacter());
      characters = [{ id, name: "" }];
      activeId = id;
    }
    localStorage.setItem("flagondice-characters", JSON.stringify(characters));
    localStorage.setItem("flagondice-active-character", activeId);
  }
  if (!activeId || !characters.some(c => c.id === activeId)) {
    activeId = characters[0].id;
    localStorage.setItem("flagondice-active-character", activeId);
  }
  return { activeId, characters, data: loadCharacterData(activeId) };
}

function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4, fontSize: 12, color: TEXT.faint }}>
      {label}
      {children}
    </label>
  );
}

function Section({ title, children }) {
  return (
    <div style={{ background: PANEL, border: `0.5px solid ${BORDER}`, borderRadius: 8, padding: 16, marginBottom: 16 }}>
      <div style={{ fontFamily: HEADFONT, fontWeight: 700, fontSize: 15, color: ACCENT, marginBottom: 12 }}>{title}</div>
      {children}
    </div>
  );
}

// Each core stat gets its own accent so the sheet's stat row reads at a
// glance instead of as a wall of identical gray chips.
const STAT_COLORS = {
  Health: "#e0785a",
  Armor: "#8fa6c9",
  Speed: "#7bc47f",
  Mana: "#b090e0",
};

function StatChip({ label, value }) {
  if (value === null || value === undefined) return null;
  const color = STAT_COLORS[label] || ACCENT;
  return (
    <div style={{ background: "#1c150f", border: `0.5px solid ${color}55`, borderRadius: 8, padding: "10px 6px", textAlign: "center" }}>
      <div style={{ fontFamily: HEADFONT, fontSize: 13, fontWeight: 700, color, textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
      <div style={{ fontFamily: HEADFONT, fontSize: 26, color: TEXT.name, fontWeight: 700, marginTop: 2 }}>{value}</div>
    </div>
  );
}

// A stat chip for a trackable resource (Health/Mana) — shows current/max
// plus inline −/+/reset buttons on the same line, so adjusting it during
// play doesn't require leaving the stats row.
function TrackedStatChip({ label, current, max, onAdjust, onReset }) {
  if (max === null || max === undefined) return null;
  const color = STAT_COLORS[label] || ACCENT;
  return (
    <div style={{ background: "#1c150f", border: `0.5px solid ${color}55`, borderRadius: 8, padding: "10px 6px", textAlign: "center" }}>
      <div style={{ fontFamily: HEADFONT, fontSize: 13, fontWeight: 700, color, textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
      <div style={{ fontFamily: HEADFONT, fontSize: 26, color: TEXT.name, fontWeight: 700, marginTop: 2, marginBottom: 4 }}>{current} <span style={{ fontSize: 15, color: TEXT.faint }}>/ {max}</span></div>
      <div className="no-print" style={{ display: "flex", gap: 3, justifyContent: "center" }}>
        <button onClick={() => onAdjust(-1)} title={`−1 ${label}`} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 4, color: "#e0785a", width: 22, height: 22, fontSize: 13, lineHeight: 1 }}>−</button>
        <button onClick={() => onAdjust(1)} title={`+1 ${label}`} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 4, color: "#7bc47f", width: 22, height: 22, fontSize: 13, lineHeight: 1 }}>+</button>
        <button onClick={onReset} title={`Reset ${label} to max`} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 4, color: TEXT.muted, width: 22, height: 22, fontSize: 11, lineHeight: 1 }}>↺</button>
      </div>
    </div>
  );
}

// Read-only pip row — used on the Character sheet's skill summary.
function SkillPipsReadOnly({ value }) {
  return (
    <span style={{ letterSpacing: 2 }}>
      {Array.from({ length: MAX_SKILL_PIPS }, (_, i) => (
        <span key={i} style={{ color: i < value ? ACCENT : BORDER, fontSize: 15 }}>{i < value ? "●" : "○"}</span>
      ))}
      {value > MAX_SKILL_PIPS && <span style={{ color: TEXT.faint, fontSize: 11 }}> +{value - MAX_SKILL_PIPS}</span>}
    </span>
  );
}

// Clickable pip row for the Builder — click a pip to set the skill to
// that many points (clicking the currently-topmost filled pip again
// clears it back down by one). Increases are blocked once the total
// spent across all skills hits the character's skill point budget.
function SkillPipsEditable({ value, onChange, skillSpent, skillBudget }) {
  return (
    <span style={{ letterSpacing: 2 }}>
      {Array.from({ length: MAX_SKILL_PIPS }, (_, i) => {
        const n = i + 1;
        const filled = n <= value;
        // A click on pip n jumps straight to n (not +1), so the budget
        // check has to be delta-aware: would setting THIS skill to n —
        // replacing its current contribution — push total spend over
        // budget? A single "spent >= budget" flag doesn't catch a jump
        // of more than 1 pip while under budget.
        const wouldExceed = n > value && (skillSpent - value + n) > skillBudget;
        return (
          <button
            key={i}
            onClick={() => onChange(value === n ? n - 1 : n)}
            disabled={wouldExceed}
            title={`${n} point${n > 1 ? "s" : ""}`}
            style={{
              background: "transparent", border: "none", padding: 0, marginRight: 2,
              color: filled ? ACCENT : (wouldExceed ? "#2a221a" : BORDER),
              fontSize: 17, lineHeight: 1, cursor: wouldExceed ? "not-allowed" : "pointer",
            }}
          >
            {filled ? "●" : "○"}
          </button>
        );
      })}
    </span>
  );
}

function App() {
  const [classes, setClasses] = useState([]);
  const [backgrounds, setBackgrounds] = useState([]);
  const [skillDefs, setSkillDefs] = useState([]);
  const [items, setItems] = useState([]);
  const [bonusTrainings, setBonusTrainings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("build");
  const [itemSearch, setItemSearch] = useState("");
  const [shareMsg, setShareMsg] = useState("");
  const importRef = useRef();
  const firstLoad = useRef(true);

  const initialRef = useRef(null);
  if (initialRef.current === null) initialRef.current = loadActiveCharacterState();
  const [activeId, setActiveId] = useState(initialRef.current.activeId);
  const [characters, setCharacters] = useState(initialRef.current.characters);
  const [char, setChar] = useState(initialRef.current.data);

  useEffect(() => {
    Promise.all([
      fetch("data/classes.json").then(r => r.json()),
      fetch("data/backgrounds.json").then(r => r.json()),
      fetch("data/skills.json").then(r => r.json()),
      fetch("data/items.json").then(r => r.json()),
      fetch("data/bonus-trainings.json").then(r => r.json()),
    ]).then(([c, b, s, it, bt]) => { setClasses(c); setBackgrounds(b); setSkillDefs(s); setItems(it); setBonusTrainings(bt); setLoading(false); });
  }, []);

  // ── Persist the active character, and keep the switcher list synced ──
  useEffect(() => {
    if (firstLoad.current) { firstLoad.current = false; return; }
    saveCharacterData(activeId, char);
  }, [activeId, char]);
  useEffect(() => { localStorage.setItem("flagondice-characters", JSON.stringify(characters)); }, [characters]);
  useEffect(() => { localStorage.setItem("flagondice-active-character", activeId); }, [activeId]);
  useEffect(() => {
    setCharacters(cs => cs.some(c => c.id === activeId && c.name === char.charName)
      ? cs
      : cs.map(c => c.id === activeId ? { ...c, name: char.charName } : c));
  }, [char.charName, activeId]);

  const set = patch => setChar(c => ({ ...c, ...patch }));

  const switchCharacter = id => {
    if (id === activeId) return;
    setActiveId(id);
    setChar(loadCharacterData(id));
  };

  // Used by "+ New", importing a file, opening a share link, and
  // Duplicate — always adds a fresh slot and switches to it, so nothing
  // already open can be overwritten by someone else's link or file.
  const addCharacterSlot = (data = {}, { switchView } = {}) => {
    const id = makeUid();
    const full = { ...emptyCharacter(), ...data };
    saveCharacterData(id, full);
    setCharacters(cs => [...cs, { id, name: full.charName || "" }]);
    setActiveId(id);
    setChar(full);
    if (switchView) setView(switchView);
    return id;
  };

  const deleteCharacter = id => {
    if (characters.length <= 1) return;
    localStorage.removeItem(`flagondice-char-${id}`);
    setCharacters(cs => {
      const next = cs.filter(c => c.id !== id);
      if (id === activeId) {
        setActiveId(next[0].id);
        setChar(loadCharacterData(next[0].id));
      }
      return next;
    });
  };

  const duplicateCharacter = () => {
    addCharacterSlot({ ...char, charName: char.charName ? `${char.charName} (copy)` : "Unnamed adventurer (copy)" });
  };

  const cls = classes.find(c => c.id === char.classId) || null;
  const spec = cls ? cls.specializations.find(s => s.id === char.specId) : null;
  const statBonuses = collectStatBonuses(char, backgrounds, items);
  const stats = computeStats(cls, spec, char.level, char.heroBlessing, statBonuses);
  const skillBudget = skillPointBudget(char);
  const skillSpent = Object.values(char.skills).reduce((a, b) => a + b, 0);
  const bonusGrants = collectBonusGrants(char, backgrounds, items);

  const chooseClass = id => {
    const next = classes.find(c => c.id === id);
    const nextStats = computeStats(next, null, char.level, char.heroBlessing, statBonuses);
    set({
      classId: id, specId: "", knownTrainings: [],
      hpCurrent: nextStats.health, manaCurrent: nextStats.mana || 0,
    });
  };

  const trainingPool = cls ? [
    ...cls.baseTrainings.map(t => ({ ...t, source: cls.trainingsLabel })),
    ...(spec ? spec.trainingsAdded.map(t => ({ ...t, source: spec.name })) : []),
  ] : [];
  const available = trainingPool.filter(t => t.levelReq <= char.level);
  const slots = cls ? trainingSlots(cls, char.level, !!char.specId) : 0;
  const known = char.knownTrainings.filter(n => available.some(t => t.name === n));
  // Chosen trainings/spells float to the top of the Builder checklist as
  // soon as they're picked, so the list doesn't need scrolling to see
  // what you've already taken. Array.sort is stable, so ties (both known
  // or both unknown) keep their original relative order.
  const availableSorted = [...available].sort((a, b) => (known.includes(b.name) ? 1 : 0) - (known.includes(a.name) ? 1 : 0));

  const toggleTraining = name => {
    const isKnown = char.knownTrainings.includes(name);
    if (isKnown) set({ knownTrainings: char.knownTrainings.filter(n => n !== name) });
    else if (known.length < slots) set({ knownTrainings: [...char.knownTrainings, name] });
  };

  // Builder shows every active feature. Base-class "level up" entries
  // (extra trainings/spells known, skill points, Hero's Blessing, plain
  // stat bumps) are all flagged statOnly for now — they're bookkeeping
  // already reflected elsewhere (the trainings list, the skill pips, the
  // stat row), not standalone features. Only full specialization
  // abilities are real "features" until the class-by-class pass that
  // tells the genuine new abilities apart from ability-count increases.
  const activeFeaturesAll = [];
  if (cls) {
    activeFeaturesAll.push({ name: cls.resourceAbility.name, text: cls.resourceAbility.text, statOnly: false });
    cls.levels.filter(l => l.level <= char.level && l.level !== 2 && l.level !== 10).forEach(l =>
      l.text.forEach(t => activeFeaturesAll.push({ name: `Level ${l.level}`, text: t, statOnly: true }))
    );
  }
  if (spec) {
    spec.levels.filter(l => l.level <= char.level).forEach(l =>
      l.abilities.forEach(a => activeFeaturesAll.push({ name: a.name, text: a.text, statOnly: STAT_ONLY_NAMES.has(a.name) }))
    );
  }
  // Sheet hides the stat-only/bookkeeping ones — only the class's core
  // resource ability and full specialization features show up there.
  const classFeaturesForSheet = activeFeaturesAll.filter(f => !f.statOnly);

  const background = backgrounds.find(b => b.id === char.backgroundId) || null;

  // Switching Background resets its skill-choice slots — a previous
  // Background's picks don't carry over if the new one doesn't offer the
  // same options.
  const chooseBackground = id => {
    const next = backgrounds.find(b => b.id === id);
    set({
      backgroundId: id,
      backgroundSkillChoices: next ? next.skillChoices.map(() => "") : [],
    });
  };
  const setBackgroundSkillChoice = (index, skillName) => {
    const next = [...char.backgroundSkillChoices];
    next[index] = skillName;
    set({ backgroundSkillChoices: next });
  };

  // A Background's bonus point(s) are locked to specific skills (see
  // backgrounds.json's skillChoices) rather than being free-spend like
  // the general pool — bgBonusMap tallies how many of those landed on
  // each skill, and finalSkillValue is what's actually shown/used.
  const bgBonusMap = {};
  (char.backgroundSkillChoices || []).forEach(s => { if (s) bgBonusMap[s] = (bgBonusMap[s] || 0) + 1; });
  const finalSkillValue = name => (char.skills[name] || 0) + (bgBonusMap[name] || 0);

  // ── Items tab helpers ──
  const itemsByCategory = items.reduce((acc, it) => { (acc[it.category] = acc[it.category] || []).push(it); return acc; }, {});
  const invMap = char.inventory.reduce((acc, e) => { acc[e.name] = e.qty; return acc; }, {});
  const addToInventory = name => {
    const found = char.inventory.find(e => e.name === name);
    if (found) set({ inventory: char.inventory.map(e => e.name === name ? { ...e, qty: e.qty + 1 } : e) });
    else set({ inventory: [...char.inventory, { name, qty: 1 }] });
  };
  const adjustInventory = (name, delta) => {
    set({
      inventory: char.inventory
        .map(e => e.name === name ? { ...e, qty: e.qty + delta } : e)
        .filter(e => e.qty > 0),
    });
  };
  const addCustomItem = () => set({ customItems: [...char.customItems, { id: makeUid(), name: "", text: "", qty: 1 }] });
  const updateCustomItem = (id, patch) => set({ customItems: char.customItems.map(c => c.id === id ? { ...c, ...patch } : c) });
  const removeCustomItem = id => set({ customItems: char.customItems.filter(c => c.id !== id) });

  // Does this item's "training" grant (if it has one) point at a
  // trainingId the character already has access to, from ANY currently
  // active source (Background or an already-learned item)? Blocks
  // re-learning the same spell twice, matching "once learned, you don't
  // get it a second time."
  const alreadyGrantsSameTraining = item => {
    const trainingGrant = (item.grants || []).find(g => g.type === "training");
    if (!trainingGrant) return false;
    return gatherAllGrants(char, backgrounds, items).some(g => g.type === "training" && g.trainingId === trainingGrant.trainingId);
  };

  // Consumes one copy of an item that permanently grants something (a
  // bonus training, a stat bonus, or both — see items.json's `grants`)
  // — removes it from inventory and records the learn so gatherAllGrants
  // picks up everything that item currently grants.
  const learnFromItem = item => {
    if (!item.grants || (invMap[item.name] || 0) <= 0 || alreadyGrantsSameTraining(item)) return;
    adjustInventory(item.name, -1);
    set({ learnedItems: [...char.learnedItems, { id: makeUid(), itemName: item.name }] });
  };

  // Fully undoes one "Learn" action — for an accidental click. Reverses
  // exactly what that item currently grants (recomputed live, so it's
  // correct even if the item's data changes later), clamps current Mana
  // down if it's now above the new max, and gives the consumed item back
  // to inventory so the whole action is undone, not just its effects.
  const unlearnItem = entryId => {
    const entry = char.learnedItems.find(e => e.id === entryId);
    if (!entry) return;
    const nextLearnedItems = char.learnedItems.filter(e => e.id !== entryId);
    const newStatBonuses = collectStatBonuses({ ...char, learnedItems: nextLearnedItems }, backgrounds, items);
    const newStats = computeStats(cls, spec, char.level, char.heroBlessing, newStatBonuses);
    const alreadyCarried = char.inventory.find(e => e.name === entry.itemName);
    const nextInventory = alreadyCarried
      ? char.inventory.map(e => e.name === entry.itemName ? { ...e, qty: e.qty + 1 } : e)
      : [...char.inventory, { name: entry.itemName, qty: 1 }];
    set({
      learnedItems: nextLearnedItems,
      manaCurrent: newStats.mana !== null ? Math.min(char.manaCurrent, newStats.mana) : char.manaCurrent,
      inventory: nextInventory,
    });
  };

  // ── Notes tab helpers ──
  const addNoteRow = () => set({ noteRows: [...char.noteRows, { id: makeUid(), text: "" }] });
  const updateNoteRow = (id, text) => set({ noteRows: char.noteRows.map(r => r.id === id ? { ...r, text } : r) });
  const removeNoteRow = id => set({ noteRows: char.noteRows.filter(r => r.id !== id) });

  // ── HP / Mana quick adjust ──
  const applyHp = delta => set({ hpCurrent: Math.max(0, Math.min(stats.health, char.hpCurrent + delta)) });
  const applyMana = delta => set({ manaCurrent: Math.max(0, Math.min(stats.mana || 0, char.manaCurrent + delta)) });
  const resetHp = () => set({ hpCurrent: stats.health });
  const resetMana = () => set({ manaCurrent: stats.mana || 0 });

  // Free casts used this encounter for a bonus training — clamped to how
  // many free casts are actually granted; a Reset puts it back to 0 (end
  // of encounter / after a rest).
  const adjustBonusUse = (trainingId, freeCasts, delta) => {
    const next = Math.max(0, Math.min(freeCasts, (char.bonusTrainingUses[trainingId] || 0) + delta));
    set({ bonusTrainingUses: { ...char.bonusTrainingUses, [trainingId]: next } });
  };
  const resetBonusUse = trainingId => set({ bonusTrainingUses: { ...char.bonusTrainingUses, [trainingId]: 0 } });

  // ── Export / Import / Share ──
  const doExport = () => {
    const blob = new Blob([JSON.stringify(char, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${(char.charName || "flagon-dice-character").replace(/\s+/g, "-")}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const doImport = e => {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then(txt => {
      try { addCharacterSlot(JSON.parse(txt)); }
      catch { alert("That file doesn't look like a valid character export."); }
    });
    e.target.value = "";
  };
  const doShare = () => {
    const encoded = encChar({
      charName: char.charName, backgroundId: char.backgroundId, backgroundSkillChoices: char.backgroundSkillChoices, skills: char.skills,
      classId: char.classId, specId: char.specId, level: char.level,
      knownTrainings: char.knownTrainings, heroBlessing: char.heroBlessing,
      learnedItems: char.learnedItems,
    });
    const url = window.location.href.split("#")[0] + "#char=" + encoded;
    const legacyCopy = () => {
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => setShareMsg("Link copied!")).catch(legacyCopy);
    } else legacyCopy();
    setTimeout(() => setShareMsg(""), 4500);
  };

  // ── Opening a shared link lands in a new slot, never overwrites
  // whatever's currently open ──
  useEffect(() => {
    const hash = window.location.hash;
    if (!hash.startsWith("#char=")) return;
    const decoded = decChar(hash.slice(6));
    window.history.replaceState(null, "", window.location.href.split("#")[0]);
    if (decoded) addCharacterSlot(decoded, { switchView: "build" });
    // eslint-disable-next-line
  }, []);

  const tabStyle = key => ({
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background: view === key ? ACCENT : "transparent",
    color: view === key ? "#191410" : TEXT.muted,
    border: `0.5px solid ${view === key ? ACCENT : BORDER}`,
    textDecoration: "none", display: "inline-flex", alignItems: "center",
  });
  const bookLinkStyle = {
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background: "#132227", color: BOOKLINK,
    border: `0.5px solid #2f5a67`,
    textDecoration: "none", display: "inline-flex", alignItems: "center",
  };
  const actionBtn = (danger = false) => ({
    padding: "6px 14px", fontSize: 13, fontWeight: 500, borderRadius: 6,
    background: "transparent",
    color: danger ? "#c0392b" : TEXT.muted,
    border: `0.5px solid ${danger ? "#c0392b" : BORDER}`,
  });

  if (loading) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: TEXT.faint, fontFamily: HEADFONT, fontSize: 18 }}>
      Loading…
    </div>
  );

  const itemMatches = it => !itemSearch || it.name.toLowerCase().includes(itemSearch.toLowerCase()) || it.text.toLowerCase().includes(itemSearch.toLowerCase());

  return (
    <div>
      <div className="no-print site-header" style={{
        padding: "12px 20px", borderBottom: `0.5px solid ${BORDER}`,
        background: "#14100c", position: "sticky", top: 0, zIndex: 100,
      }}>
        <div className="site-header-brand" style={{ textAlign: "center" }}>
          <div style={{ fontFamily: HEADFONT, fontSize: 22, fontWeight: 700, color: ACCENT, letterSpacing: "0.03em" }}>Flagon Dice</div>
          <div style={{ fontSize: 12, color: TEXT.faint, marginTop: 1 }}>Roll one die, keep it, get on with it</div>
        </div>

        {/* Character switcher */}
        <div className="site-header-left" style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <select
            value={activeId}
            onChange={e => switchCharacter(e.target.value)}
            style={{ maxWidth: 160, padding: "6px 8px" }}
          >
            {characters.map(c => <option key={c.id} value={c.id}>{c.name || "Unnamed adventurer"}</option>)}
          </select>
          <button onClick={() => addCharacterSlot({}, { switchView: "build" })} title="New character" style={actionBtn()}>+ New</button>
          {characters.length > 1 && (
            <button
              onClick={() => { if (confirm(`Delete "${char.charName || "Unnamed adventurer"}"? This can't be undone.`)) deleteCharacter(activeId); }}
              title="Delete this character" style={actionBtn(true)}
            >Delete</button>
          )}
        </div>

        <div className="site-header-nav" style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <button onClick={() => setView("build")} style={tabStyle("build")}>Builder</button>
          <button onClick={() => setView("items")} style={tabStyle("items")}>Items</button>
          <button onClick={() => setView("sheet")} style={tabStyle("sheet")}>Character sheet</button>
          <button onClick={() => setView("notes")} style={tabStyle("notes")}>Notes</button>

          <div style={{ width: 40, display: "flex", justifyContent: "center", alignItems: "center", flexShrink: 0 }} aria-hidden="true">
            <div style={{ width: 1, height: 22, background: BORDER }} />
          </div>

          <a href="compendium.html" target="_blank" rel="noopener noreferrer" style={bookLinkStyle}>Compendium</a>
          <a href="reference.html" target="_blank" rel="noopener noreferrer" style={bookLinkStyle}>Reference</a>
        </div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: 20 }}>

        {/* ═══ BUILDER ═══ */}
        {view === "build" && (
          <>
            <div className="pair-grid">
              <Section title="Concept">
                <div className="field-grid" style={{ marginBottom: 10 }}>
                  <Field label="Name">
                    <input type="text" value={char.charName} onChange={e => set({ charName: e.target.value })} />
                  </Field>
                  <Field label="Level">
                    <input type="number" min="1" max="10" value={char.level} onChange={e => set({ level: Math.max(1, Math.min(10, Number(e.target.value) || 1)) })} />
                  </Field>
                </div>
                <Field label="Concept / backstory">
                  <textarea rows="2" value={char.charConcept} onChange={e => set({ charConcept: e.target.value })} />
                </Field>
              </Section>

              <Section title="Skills">
                <div style={{ fontSize: 13, color: TEXT.faint, marginBottom: 10 }}>
                  Free skill points: <strong style={{ color: skillSpent >= skillBudget ? ACCENT : TEXT.name }}>{skillSpent} / {skillBudget}</strong>
                  <span style={{ marginLeft: 6, fontSize: 11 }}>(1 from character creation{char.level >= 4 ? ", +1 at level 4" : ""}{char.level >= 7 ? ", +1 at level 7" : ""}{char.level >= 10 && char.heroBlessing === "skill" ? ", +1 from Hero's Blessing" : ""})</span>
                </div>
                {background && background.skillChoices.length > 0 && (
                  <div style={{ fontSize: 11, color: TEXT.faint, marginBottom: 10 }}>
                    Your Background's skill point(s) are chosen in the Background section — they don't come out of this pool.
                  </div>
                )}
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {skillDefs.map(s => (
                    <div key={s.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                      <span style={{ fontSize: 14, color: TEXT.body }}>{s.name}</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        {/* Fixed-width slot so the badge appearing/not
                            appearing never shifts the pips out of column
                            with the rows above/below it. */}
                        <span style={{ fontSize: 11, color: ACCENT, minWidth: 32, textAlign: "right" }}>
                          {bgBonusMap[s.name] > 0 ? `+${bgBonusMap[s.name]} bg` : ""}
                        </span>
                        <SkillPipsEditable
                          value={char.skills[s.name] || 0}
                          skillSpent={skillSpent}
                          skillBudget={skillBudget}
                          onChange={n => set({ skills: { ...char.skills, [s.name]: Math.max(0, n) } })}
                        />
                        <span style={{ fontSize: 12, color: TEXT.faint, minWidth: 46, textAlign: "right" }}>Total {finalSkillValue(s.name)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </Section>
            </div>

            <Section title="Background">
              <Field label="Choose a Background">
                <select value={char.backgroundId} onChange={e => chooseBackground(e.target.value)}>
                  <option value="">— none —</option>
                  {backgrounds.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
              </Field>
              {background && (
                <div style={{ fontSize: 13, color: TEXT.body, lineHeight: 1.6, marginTop: 10 }}>
                  {background.description && <p style={{ marginBottom: 6 }}>{background.description}</p>}
                  <p style={{ marginBottom: 6 }}><strong style={{ color: TEXT.name }}>Skills</strong>: {background.skills}</p>
                  {background.features.map((f, i) => (
                    <p key={i}><strong style={{ color: TEXT.name }}>{f.name}</strong>: {f.text}</p>
                  ))}
                  {(background.grants || []).filter(g => g.type === "statBonus").map((g, i) => (
                    <p key={"sb" + i}><strong style={{ color: TEXT.name }}>+{g.amount} {g.stat[0].toUpperCase() + g.stat.slice(1)}</strong></p>
                  ))}
                  {(() => {
                    // Aggregate just this Background's own training/freeCasts
                    // grants — a scoped view, so the preview reflects only
                    // what THIS source grants even if other sources (learned
                    // items) also contribute to the same spell elsewhere.
                    const byTraining = {};
                    (background.grants || []).forEach(g => {
                      if (g.type !== "training" && g.type !== "freeCasts") return;
                      const cur = byTraining[g.trainingId] || { trainingId: g.trainingId, freeCasts: 0, manaCost: null };
                      if (g.type === "freeCasts") cur.freeCasts += g.amount || 0;
                      if (g.type === "training" && g.manaCost != null) cur.manaCost = cur.manaCost == null ? g.manaCost : Math.min(cur.manaCost, g.manaCost);
                      byTraining[g.trainingId] = cur;
                    });
                    return Object.values(byTraining).map((g, i) => {
                      const t = bonusTrainings.find(bt => bt.id === g.trainingId);
                      if (!t) return null;
                      return (
                        <p key={i}>
                          <strong style={{ color: TEXT.name }}>{t.name}</strong>: {t.text}
                          {" "}{g.freeCasts > 0 ? `Free to use ${g.freeCasts}× per encounter` : ""}
                          {g.manaCost != null ? `${g.freeCasts > 0 ? ", after that" : "Can be cast"} for ${g.manaCost} Mana.` : "."}
                        </p>
                      );
                    });
                  })()}
                </div>
              )}
              {background && background.skillChoices.length > 0 && (
                <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 10 }}>
                  {background.skillChoices.map((choice, i) => (
                    <Field key={i} label={`Background skill point${background.skillChoices.length > 1 ? ` ${i + 1}` : ""} — choose ${choice.options.join(" or ")}`}>
                      <select value={char.backgroundSkillChoices[i] || ""} onChange={e => setBackgroundSkillChoice(i, e.target.value)}>
                        <option value="">— choose —</option>
                        {choice.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                      </select>
                    </Field>
                  ))}
                </div>
              )}
            </Section>

            <Section title="Class">
              <Field label="Choose a Class">
                <select value={char.classId} onChange={e => chooseClass(e.target.value)}>
                  <option value="">— none —</option>
                  {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </Field>

              {cls && (
                <>
                  <div className="field-grid-4" style={{ marginTop: 14 }}>
                    <StatChip label="Health" value={stats.health} />
                    <StatChip label="Armor" value={stats.armor} />
                    <StatChip label="Speed" value={stats.speed} />
                    <StatChip label="Mana" value={stats.mana} />
                  </div>
                  <div style={{ fontSize: 11, color: TEXT.faint, marginTop: 6 }}>
                    Computed automatically from your class, specialization, and level. Current Health/Mana are tracked on the Character sheet tab.
                  </div>

                  {char.level >= 2 && (
                    <div style={{ marginTop: 14 }}>
                      <Field label="Specialization (level 2+)">
                        <select value={char.specId} onChange={e => set({ specId: e.target.value })}>
                          <option value="">— none —</option>
                          {cls.specializations.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </Field>
                    </div>
                  )}

                  <div style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 13, color: TEXT.faint, marginBottom: 6 }}>
                      {cls.trainingsLabel} known: {known.length} / {slots}
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 260, overflowY: "auto", paddingRight: 4 }}>
                      {availableSorted.map(t => {
                        const isKnown = char.knownTrainings.includes(t.name);
                        const disabled = !isKnown && known.length >= slots;
                        return (
                          <label key={t.name} style={{ display: "flex", gap: 8, fontSize: 13, color: disabled ? TEXT.faint : TEXT.body, alignItems: "flex-start" }}>
                            <input type="checkbox" checked={isKnown} disabled={disabled} onChange={() => toggleTraining(t.name)} style={{ marginTop: 3, width: "auto" }} />
                            <span><strong style={{ color: TEXT.name }}>{t.name}</strong> <span style={{ color: TEXT.faint, fontSize: 11 }}>({t.source})</span>: {t.text}</span>
                          </label>
                        );
                      })}
                      {available.length === 0 && <div style={{ fontSize: 13, color: TEXT.faint }}>Nothing available yet.</div>}
                    </div>
                  </div>

                  {char.level >= 10 && (
                    <div style={{ marginTop: 14 }}>
                      <Field label="Hero's Blessing (level 10)">
                        <select value={char.heroBlessing} onChange={e => set({ heroBlessing: e.target.value })}>
                          <option value="">— choose —</option>
                          {HERO_BLESSINGS.filter(h => !h.manaOnly || cls.stats.mana !== null).map(h => (
                            <option key={h.id} value={h.id}>{h.label}</option>
                          ))}
                        </select>
                      </Field>
                    </div>
                  )}

                  <div style={{ marginTop: 16 }}>
                    <div style={{ fontSize: 13, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Active features (incl. stat bonuses)</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      {activeFeaturesAll.map((f, i) => (
                        <div key={i} style={{ fontSize: 12, color: f.statOnly ? TEXT.faint : TEXT.body, lineHeight: 1.5 }}>
                          <strong style={{ color: f.statOnly ? TEXT.faint : TEXT.name }}>{f.name}</strong>: {f.text}
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              )}
            </Section>

            {/* Audit trail for anything permanently learned from a
                consumable item (e.g. Tome of Mana Bolt) — lets a mistaken
                "Learn" click on the Items tab be undone cleanly. Each
                entry's effects are read live from that item's `grants`,
                so the list always matches what's actually being applied. */}
            <Section title="Permanent Item Bonuses">
              {char.learnedItems.length === 0 ? (
                <div style={{ fontSize: 13, color: TEXT.faint }}>
                  Nothing learned yet — items that permanently grant something (like the Tome of Mana Bolt) show a "Learn" button on the Items tab once you're carrying one.
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {char.learnedItems.map(entry => {
                    const item = items.find(it => it.name === entry.itemName);
                    const grantLines = (item && item.grants || []).map(g => {
                      if (g.type === "training") {
                        const t = bonusTrainings.find(bt => bt.id === g.trainingId);
                        return t ? `Teaches ${t.name}` : null;
                      }
                      if (g.type === "freeCasts") {
                        const t = bonusTrainings.find(bt => bt.id === g.trainingId);
                        return `+${g.amount} free cast${g.amount === 1 ? "" : "s"}/encounter of ${t ? t.name : g.trainingId}`;
                      }
                      if (g.type === "statBonus") return `+${g.amount} max ${g.stat[0].toUpperCase() + g.stat.slice(1)}`;
                      return null;
                    }).filter(Boolean);
                    return (
                      <div key={entry.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, fontSize: 13 }}>
                        <div>
                          <strong style={{ color: TEXT.name }}>{entry.itemName}</strong>
                          {/* Builder errs toward detail: each permanent
                              effect a source grants gets its own line,
                              rather than being folded into one summary
                              string — the sheet stays terser (see the
                              Bonus Spells & Trainings / stat row instead). */}
                          {grantLines.length > 0 ? (
                            <ul style={{ margin: "3px 0 0 18px", padding: 0, color: TEXT.body }}>
                              {grantLines.map((line, i) => <li key={i}>{line}</li>)}
                            </ul>
                          ) : (
                            <div style={{ color: TEXT.faint, marginTop: 3 }}>no longer in the item data</div>
                          )}
                        </div>
                        <button onClick={() => unlearnItem(entry.id)} title="Undo — reverses these effects and returns the item to Inventory" style={{ background: "transparent", border: "0.5px solid #c0392b", color: "#c0392b", borderRadius: 6, padding: "3px 10px", fontSize: 12, flexShrink: 0 }}>Remove</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </Section>

            <div className="no-print" style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
              <button onClick={doExport} style={actionBtn()}>Export</button>
              <button onClick={() => importRef.current.click()} style={actionBtn()}>Import</button>
              <input ref={importRef} type="file" accept=".json,application/json" onChange={doImport} style={{ display: "none" }} />
              <button onClick={doShare} style={actionBtn()}>Copy share link</button>
              <button onClick={duplicateCharacter} style={actionBtn()}>Duplicate</button>
              {shareMsg && <span style={{ fontSize: 13, color: ACCENT }}>{shareMsg}</span>}
            </div>
          </>
        )}

        {/* ═══ ITEMS ═══ */}
        {view === "items" && (
          <>
            <Section title="Gold & Inventory">
              <Field label="Gold">
                <input type="number" min="0" style={{ maxWidth: 140 }} value={char.gold} onChange={e => set({ gold: Number(e.target.value) || 0 })} />
              </Field>
              <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
                {char.inventory.length === 0 && char.customItems.length === 0 && (
                  <div style={{ fontSize: 13, color: TEXT.faint }}>Nothing carried yet — add items from the list below.</div>
                )}
                {char.inventory.map((e, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                    <span style={{ flex: 1, color: TEXT.body }}>{e.name}</span>
                    <button onClick={() => adjustInventory(e.name, -1)} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 6, color: TEXT.muted, width: 26, height: 26 }}>−</button>
                    <span style={{ color: TEXT.name, minWidth: 18, textAlign: "center" }}>{e.qty}</span>
                    <button onClick={() => adjustInventory(e.name, 1)} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 6, color: TEXT.muted, width: 26, height: 26 }}>+</button>
                  </div>
                ))}
                {char.customItems.map(c => (
                  <div key={c.id} style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <input type="text" placeholder="Custom item name" value={c.name} onChange={e => updateCustomItem(c.id, { name: e.target.value })} style={{ flex: 1 }} />
                    <input type="text" placeholder="What it does" value={c.text} onChange={e => updateCustomItem(c.id, { text: e.target.value })} style={{ flex: 2 }} />
                    <input type="number" min="0" style={{ maxWidth: 60 }} value={c.qty} onChange={e => updateCustomItem(c.id, { qty: Number(e.target.value) || 0 })} />
                    <button onClick={() => removeCustomItem(c.id)} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 6, color: TEXT.muted, padding: "0 10px" }}>✕</button>
                  </div>
                ))}
                <button onClick={addCustomItem} style={{ alignSelf: "flex-start", background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 6, color: TEXT.muted, padding: "6px 12px", fontSize: 13 }}>+ Add custom item (GM-granted, homebrew, etc.)</button>
              </div>
            </Section>

            <Section title="Item Compendium">
              <input type="text" placeholder="Search items…" value={itemSearch} onChange={e => setItemSearch(e.target.value)} style={{ marginBottom: 14 }} />
              {Object.entries(itemsByCategory).map(([cat, list]) => {
                const filtered = list.filter(itemMatches);
                if (filtered.length === 0) return null;
                return (
                  <div key={cat} style={{ marginBottom: 18 }}>
                    <div style={{ fontFamily: HEADFONT, fontSize: 15, color: TEXT.name, marginBottom: 8 }}>{cat}</div>
                    <div className="item-grid">
                      {filtered.map((it, i) => (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 13, lineHeight: 1.5, padding: "8px 0", borderBottom: `0.5px solid ${BORDER}` }}>
                          <div>
                            <strong style={{ color: TEXT.name }}>{it.name}{it.masterwork && <span style={{ color: ACCENT }}> (+)</span>}</strong>
                            <span style={{ color: TEXT.body }}>: {it.text}</span>
                          </div>
                          <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                            <button onClick={() => addToInventory(it.name)} style={{ background: "transparent", border: `0.5px solid ${ACCENT}`, color: ACCENT, borderRadius: 6, padding: "2px 10px", fontSize: 12, height: 26 }}>
                              + Add{invMap[it.name] ? ` (${invMap[it.name]})` : ""}
                            </button>
                            {it.grants && (
                              <button
                                onClick={() => learnFromItem(it)}
                                disabled={(invMap[it.name] || 0) <= 0 || alreadyGrantsSameTraining(it)}
                                title={(invMap[it.name] || 0) <= 0 ? "Add it to inventory first" : "Consume 1 to permanently learn this"}
                                style={{ background: "transparent", border: `0.5px solid ${BOOKLINK}`, color: BOOKLINK, borderRadius: 6, padding: "2px 10px", fontSize: 12, height: 26 }}
                              >
                                {alreadyGrantsSameTraining(it) ? "Learned" : "Learn"}
                              </button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </Section>
          </>
        )}

        {/* ═══ CHARACTER SHEET (stripped-down, for display) ═══
             Order: stats, skill summary, attacks, trainings/spells,
             background passives, class/specialization passives. */}
        {view === "sheet" && (
          <div className="sheet-box" style={{ background: PANEL, border: `0.5px solid ${BORDER}`, borderRadius: 8, padding: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
              <div>
                <div style={{ fontFamily: HEADFONT, fontWeight: 700, fontSize: 24, color: ACCENT }}>{char.charName || "Unnamed Adventurer"}</div>
                <div style={{ fontSize: 13, color: TEXT.faint, marginTop: 2 }}>
                  {cls ? cls.name : "No class"}{spec ? ` — ${spec.name}` : ""} · Level {char.level}
                  {background ? ` · ${background.name}` : ""}
                </div>
              </div>
              <button className="no-print" onClick={() => window.print()} style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 6, color: TEXT.muted, padding: "6px 14px", fontSize: 13 }}>Print</button>
            </div>
            {/* Identity (name/meta/concept) paired with the Skills summary
                so Skills isn't a sparse full-width row by itself. */}
            <div className="pair-grid" style={{ marginTop: 10 }}>
              <div>
                {char.charConcept && <div style={{ fontSize: 13, color: TEXT.body, lineHeight: 1.6 }}>{char.charConcept}</div>}
              </div>
              <div>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Skills</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {skillDefs.map(s => (
                    <div key={s.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, color: TEXT.body }}>
                      <span>{s.name}</span>
                      <SkillPipsReadOnly value={finalSkillValue(s.name)} />
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Stats row — Armor/Speed read-only, Health/Mana trackable */}
            <div className="field-grid-4" style={{ margin: "16px 0" }}>
              <StatChip label="Armor" value={stats.armor} />
              <StatChip label="Speed" value={stats.speed} />
              <TrackedStatChip label="Health" current={char.hpCurrent} max={stats.health} onAdjust={applyHp} onReset={resetHp} />
              {stats.mana !== null && <TrackedStatChip label="Mana" current={char.manaCurrent} max={stats.mana} onAdjust={applyMana} onReset={resetMana} />}
            </div>


            {/* Attacks */}
            {cls && cls.attacks.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Attacks</div>
                {cls.attacks.map((a, i) => (
                  <div key={i} style={{ fontSize: 13, color: TEXT.body }}>{a.name}: {a.toHit} to hit, {a.damage} dmg, Range {a.range}</div>
                ))}
              </div>
            )}

            {/* Trainings / spells */}
            {known.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>
                  {cls ? cls.trainingsLabel : "Trainings"}
                </div>
                {available.filter(t => known.includes(t.name)).map((t, i) => (
                  <div key={i} style={{ fontSize: 12, color: TEXT.body, lineHeight: 1.5, marginBottom: 4 }}>
                    <strong style={{ color: TEXT.name }}>{t.name}</strong>: {t.text}
                  </div>
                ))}
              </div>
            )}

            {/* Bonus spells/trainings — granted by Background, learned
                from items, etc.; not tied to any one class. */}
            {bonusGrants.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Bonus Spells & Trainings</div>
                {bonusGrants.map(g => {
                  const t = bonusTrainings.find(bt => bt.id === g.trainingId);
                  if (!t) return null;
                  const used = char.bonusTrainingUses[g.trainingId] || 0;
                  return (
                    <div key={g.trainingId} style={{ fontSize: 12, color: TEXT.body, lineHeight: 1.5, marginBottom: 6 }}>
                      <strong style={{ color: TEXT.name }}>{t.name}</strong>
                      <span style={{ color: TEXT.faint, fontSize: 11 }}> ({g.sources.join(", ")})</span>: {t.text}
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 3 }}>
                        {g.freeCasts > 0 && (
                          <span className="no-print" style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <span style={{ fontSize: 11, color: TEXT.faint }}>Free casts: {used} / {g.freeCasts}</span>
                            <button onClick={() => adjustBonusUse(g.trainingId, g.freeCasts, 1)} disabled={used >= g.freeCasts} title="Spend a free cast" style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 4, color: "#e0785a", padding: "1px 8px", fontSize: 11, lineHeight: 1.6 }}>Use</button>
                            <button onClick={() => resetBonusUse(g.trainingId)} title="Reset (new encounter)" style={{ background: "transparent", border: `0.5px solid ${BORDER}`, borderRadius: 4, color: TEXT.muted, width: 20, height: 20, fontSize: 10, lineHeight: 1 }}>↺</button>
                          </span>
                        )}
                        {g.manaCost != null && <span style={{ fontSize: 11, color: TEXT.faint }}>{g.freeCasts > 0 ? "After that, " : ""}costs {g.manaCost} Mana</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Background passives */}
            {background && background.features.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Background — {background.name}</div>
                {background.features.map((f, i) => (
                  <div key={i} style={{ fontSize: 12, color: TEXT.body, lineHeight: 1.5, marginBottom: 4 }}>
                    <strong style={{ color: TEXT.name }}>{f.name}</strong>: {f.text}
                  </div>
                ))}
              </div>
            )}

            {/* Class / specialization passives — stat-only entries hidden */}
            {classFeaturesForSheet.length > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Class Features</div>
                {classFeaturesForSheet.map((f, i) => (
                  <div key={i} style={{ fontSize: 12, color: TEXT.body, lineHeight: 1.5, marginBottom: 4 }}>
                    <strong style={{ color: TEXT.name }}>{f.name}</strong>: {f.text}
                  </div>
                ))}
              </div>
            )}

            {char.heroBlessing && (char.heroBlessing === "damage" || char.heroBlessing === "skill") && (
              <div style={{ fontSize: 12, color: TEXT.body, marginBottom: 16 }}>
                <strong style={{ color: TEXT.name }}>Hero's Blessing</strong>: {(HERO_BLESSINGS.find(h => h.id === char.heroBlessing) || {}).label}
              </div>
            )}

            <div style={{ fontSize: 13, color: TEXT.body, marginBottom: 10 }}>Gold: <strong style={{ color: TEXT.name }}>{char.gold}</strong></div>

            {(char.inventory.length > 0 || char.customItems.length > 0) && (
              <div>
                <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Inventory</div>
                {char.inventory.map((e, i) => (
                  <div key={i} style={{ fontSize: 12, color: TEXT.body }}>{e.name} {e.qty > 1 ? `×${e.qty}` : ""}</div>
                ))}
                {char.customItems.filter(c => c.name).map(c => (
                  <div key={c.id} style={{ fontSize: 12, color: TEXT.body }}>{c.name} {c.qty > 1 ? `×${c.qty}` : ""} <span style={{ color: TEXT.faint }}>— {c.text}</span></div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ═══ NOTES ═══ */}
        {view === "notes" && (
          <>
            <div style={{ fontSize: 13, color: TEXT.faint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.07em" }}>Notes</div>
            <textarea
              value={char.charNotes}
              onChange={e => set({ charNotes: e.target.value })}
              placeholder="Freeform notes about your character, campaign, plans…"
              rows={10}
              style={{ width: "100%", fontSize: 14, lineHeight: 1.5, marginBottom: 28 }}
            />

            <div style={{ fontSize: 13, color: TEXT.faint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.07em" }}>Quick List</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {char.noteRows.map(row => (
                <div key={row.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <input type="text" value={row.text} onChange={e => updateNoteRow(row.id, e.target.value)} placeholder="Note…" style={{ flex: 1, fontSize: 14 }} />
                  <button onClick={() => removeNoteRow(row.id)} aria-label="Remove note" style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 18, lineHeight: 1, padding: "2px 4px", flexShrink: 0 }}>✕</button>
                </div>
              ))}
              <button onClick={addNoteRow} style={{ fontSize: 13, color: ACCENT, background: "transparent", border: `0.5px solid ${ACCENT}`, borderRadius: 4, padding: "4px 10px", alignSelf: "flex-start" }}>+ Add row</button>
            </div>
          </>
        )}
      </div>

      <div className="no-print" style={{ textAlign: "center", padding: "26px 16px 40px", fontSize: 12, color: TEXT.faint }}>
        Flagon Dice is a playtest project by Friendly Flagon Games.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
